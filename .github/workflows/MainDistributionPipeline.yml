#
# Builds and tests decide_amox for every DuckDB platform (CPU builds) with DuckDB's own reusable pipeline.
# The DuckDB community-extensions CI uses this same pipeline to build and sign the extension, so a green run
# here is the requirement before submitting or updating the community descriptor.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: decide_amox
      # llama.cpp has no WebAssembly / MinGW / musl support in this setup; Intel macOS is not a target.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64"
